services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: turnos
      POSTGRES_PASSWORD: turnos_secret
      POSTGRES_DB: turnos
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos -d turnos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://turnos:turnos_secret@postgres:5432/turnos
      JWT_SECRET: change-me-use-at-least-16-chars
      JWT_EXPIRES_IN: 8h
      CLINIC_TZ: America/Argentina/Buenos_Aires
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    command:
      - sh
      - -c
      - npx prisma generate && npm run build && PREPARE_STATUS_DIRECT=1 node scripts/prepare-appointment-status.cjs && npx prisma db push --skip-generate --accept-data-loss && node dist/seed.js && npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  web:
    build:
      context: ../Front-Hospital/FrontHospitall
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

volumes:
  postgres_data:
  api_node_modules:
